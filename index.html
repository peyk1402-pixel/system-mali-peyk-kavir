<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم جامع مغایرت‌گیری پیک کویر</title>
    
    <!-- Scripts loaded before React -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalali-moment/dist/jalali-moment.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://aistudiocdn.com/genai/v0.1/index.js"></script>

    <!-- Import Map for React -->
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
  }
}
</script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config and Custom CSS -->
    <style type="text/tailwindcss">
        @layer base {
            html {
                font-family: 'Vazirmatn', sans-serif;
                -webkit-tap-highlight-color: transparent;
            }
        }
        @layer utilities {
            .shadow-soft {
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            }
            .shadow-lifted {
                box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.07), 0 4px 6px -4px rgb(0 0 0 / 0.07);
            }
            .animate-fade-in-up {
                animation: fade-in-up 0.6s ease-out forwards;
            }
             .animate-fade-in {
                animation: fade-in 0.3s ease-out forwards;
            }
        }
        
        .dot-grid-light {
            background-image: radial-gradient(circle at 1px 1px, #e2e8f0 1px, transparent 0);
            background-size: 24px 24px;
        }
        .dot-grid-dark {
             background-image: radial-gradient(circle at 1px 1px, #334155 1px, transparent 0);
             background-size: 24px 24px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: radial-gradient(ellipse at 70% 20%, theme('colors.indigo.500/10'), transparent 50%), radial-gradient(ellipse at 30% 80%, theme('colors.teal.500/10'), transparent 50%);
            -webkit-mask-image: linear-gradient(to bottom, white, transparent 90%);
            mask-image: linear-gradient(to bottom, white, transparent 90%);
        }

        /* Login Screen Background Animation */
        .login-bg-animation .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, theme('colors.indigo.500/5'), transparent 60%);
            animation: pulse 25s infinite ease-in-out;
        }
        .login-bg-animation .circle.c2 {
            background: radial-gradient(circle, theme('colors.teal.500/5'), transparent 60%);
            animation-duration: 20s;
        }
        @keyframes pulse {
            0% { transform: scale(0.2); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                right: 0;
                margin: 20px;
                font-family: 'Vazirmatn', sans-serif;
            }
            .print-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2rem;
                padding-bottom: 1rem;
                border-bottom: 2px solid #e5e7eb;
            }
             .print-header img {
                height: 50px;
                width: auto;
            }
            .printable-card-wrapper {
                page-break-inside: avoid;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem;
                padding: 1rem 1.5rem;
                margin-bottom: 1rem;
            }
            .printable-card-wrapper p {
                display: flex;
                justify-content: space-between;
                padding: 0.35rem 0;
                border-bottom: 1px dotted #d1d5db;
                font-size: 0.9rem;
            }
            .printable-card-wrapper p:last-of-type {
                 margin-bottom: 0;
                 border-bottom: none;
             }
             .printable-card-wrapper strong {
                font-weight: 600;
                color: #334155;
            }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                       indigo: {
                          50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                          300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                          600: '#4f46e5', 700: '#4338ca', 800: '#3730a3',
                          900: '#312e81', 950: '#1e1b4b'
                        },
                        teal: {
                          50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4',
                          300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6',
                          600: '#0d9488', 700: '#0f766e', 800: '#115e59',
                          900: '#134e4a', 950: '#042f2e'
                        },
                        primary: 'var(--color-indigo)',
                        secondary: 'var(--color-teal)'
                    },
                    boxShadow: {
                        soft: '0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05)',
                        lifted: '0 10px 15px -3px rgb(0 0 0 / 0.07), 0 4px 6px -4px rgb(0 0 0 / 0.07)',
                    },
                    keyframes: {
                       'fade-in-up': {
                            '0%': { opacity: '0', transform: 'translateY(25px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'toast-in': {
                            '0%': { transform: 'translateY(-20px) scale(0.9)', opacity: '0' },
                            '100%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                        },
                        'toast-out': {
                            '0%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                            '100%': { transform: 'translateY(-20px) scale(0.9)', opacity: '0' },
                        }
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.7s ease-out forwards',
                        'fade-in': 'fade-in 0.3s ease-out forwards',
                        'toast-in': 'toast-in 0.3s ease-out forwards',
                        'toast-out': 'toast-out 0.3s ease-out forwards',
                    }
                }
            }
        }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900">
    <div class="fixed inset-0 z-[-1] dot-grid-light dark:dot-grid-dark"></div>
    <div id="root"></div>
    <div id="printable-area" class="hidden"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
